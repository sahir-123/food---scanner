<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Food Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
  body { font-family: system-ui, -apple-system, Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 16px; background: #f5f7f5; color: #222; line-height: 1.4; }
  h2 { text-align: center; margin: 8px 0 16px; }
  button { padding: 12px 16px; font-size: 16px; border: 0; border-radius: 10px; background: #e3e8e3; cursor: pointer; }
  button.primary { background: #2e7d32; color: #fff; font-weight: 600; width: 100%; margin-bottom: 8px; }
  input, textarea { width: 100%; box-sizing: border-box; padding: 12px; font-size: 16px; border: 1px solid #ccd; border-radius: 10px; margin: 4px 0; }
  #reader { width: 100% !important; max-width: 340px; margin: 8px auto; }
  #result { background: #fff; border-radius: 14px; padding: 12px 16px; margin-top: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  #result:empty { display: none; }
  h3 { margin: 4px 0 8px; font-size: 22px; }
  h4 { margin: 14px 0 4px; }
  ul { margin: 6px 0; padding-left: 20px; }
  p { margin: 6px 0; }
</style>
</head>
<body>
  <h2>Food Scanner</h2>
  <button class="primary" onclick="startScan()">📷 Scan barcode</button>
  <button onclick="stopScan()">Stop</button>
  <div id="reader" style="width:300px"></div>
  <br>
  <input id="barcode" placeholder="Or type barcode">
  <button onclick="lookup(document.getElementById('barcode').value.trim())">Check</button>
  <div id="result"></div>

  <script>
    let scanner = null;

    async function startScan() {
      if (!scanner) scanner = new Html5Qrcode("reader");
      try {
        await scanner.start(
          { facingMode: "environment" },
          {
            fps: 10,
            qrbox: { width: 250, height: 150 },
            formatsToSupport: [
              Html5QrcodeSupportedFormats.EAN_13,
              Html5QrcodeSupportedFormats.EAN_8,
              Html5QrcodeSupportedFormats.UPC_A,
              Html5QrcodeSupportedFormats.UPC_E
            ]
          },
          async (code) => {
            await stopScan();
            document.getElementById("barcode").value = code;
            lookup(code);
          }
        );
      } catch (e) {
        document.getElementById("result").textContent = "Camera error: " + e;
      }
    }

    async function stopScan() {
      if (scanner && scanner.isScanning) {
        await scanner.stop();
      }
    }

    function level(value, low, high) {
      if (value === undefined || value === null) return { label: "n/a", color: "gray" };
      if (value <= low) return { label: "Low", color: "green" };
      if (value >= high) return { label: "High", color: "red" };
      return { label: "Medium", color: "orange" };
    }

    function row(name, value, low, high) {
      const l = level(value, low, high);
      const shown = value === undefined ? "n/a" : value.toFixed(1) + " g";
      return `<p>${name}: <b>${shown}</b> <span style="color:${l.color}">● ${l.label}</span></p>`;
    }
    function verdict(n, nova, ing) {
  const sugar = n.sugars_100g, sat = n["saturated-fat_100g"], salt = n.salt_100g;
  const reasons = [];
  let score = 0;

  if (sugar >= 22.5) { score += 2; reasons.push("Very high sugar"); }
  else if (sugar > 5) { score += 1; reasons.push("Moderate sugar"); }

  if (sat >= 5) { score += 2; reasons.push("Very high saturated fat"); }
  else if (sat > 1.5) { score += 1; reasons.push("Moderate saturated fat"); }

  if (salt >= 1.5) { score += 2; reasons.push("Very high salt"); }
  else if (salt > 0.3) { score += 1; reasons.push("Moderate salt"); }

  if (nova == 4) { score += 2; reasons.push("Ultra-processed"); }
    const iScore = ingScore(ing);
  if (iScore > 0) {
    score += iScore;
    reasons.push(iScore >= 2 ? "Several concerning ingredients" : "A concerning ingredient (see below)");
  }

  const missing = [sugar, sat, salt].some(v => v === undefined);
  let label, color;
  if (score >= 4) { label = "Limit this"; color = "red"; }
  else if (score >= 2) { label = "Okay occasionally"; color = "orange"; }
  else { label = "Looks fine"; color = "green"; }

  return `<div style="border:2px solid ${color}; padding:8px; margin:8px 0">
    <b style="color:${color}; font-size:1.2em">${label}</b>
    <ul>${reasons.map(r => `<li>${r}</li>`).join("")}</ul>
    ${missing ? "<small>Some nutrition data is missing, so this may be incomplete.</small>" : ""}
  </div>`;
}
const FLAGS = [
  { w: 1, re: /palm( kernel)? oil|palmolein/i, text: "Palm oil (high in saturated fat)" },
  { w: 2, re: /hydrogenated|vanaspati|margarine/i, text: "Hydrogenated fat (may contain trans fat)" },
  { w: 1, re: /artificial flavour/i, text: "Artificial flavours" },
  { w: 0, re: /nature[- ]identical/i, text: "Nature-identical flavours (lab-made)" },
  { w: 1, re: /aspartame|acesulfame|sucralose|saccharin|sweetener/i, text: "Artificial sweetener" },
  { w: 1, re: /\b(?:e|ins)\s?-?1\d{2}[a-z]?\b|colour|color|tartrazine|sunset yellow/i, text: "Added colour" },
  { w: 1, re: /\b(?:e|ins)\s?-?62\d\b|monosodium glutamate|\bmsg\b|flavour enhancer/i, text: "Flavour enhancer (MSG)" },
  { w: 1, re: /glucose syrup|fructose syrup|invert sugar|corn syrup|maltodextrin|dextrose/i, text: "Sugar in other forms" },
  { w: 1, re: /\b(?:e|ins)\s?-?2\d{2}[a-z]?\b|preservative|sodium benzoate|potassium sorbate/i, text: "Preservative" },
  { w: 1, re: /maida|refined wheat flour|refined flour/i, text: "Refined flour (maida)" }
];

function ingScore(text) {
  if (!text) return 0;
  const s = FLAGS.filter(f => f.re.test(text)).reduce((a, f) => a + f.w, 0);
  return Math.min(s, 3);
}

function flagsHtml(text) {
  if (!text) return "";
  const found = FLAGS.filter(f => f.re.test(text)).map(f => f.text);
  if (found.length === 0) return "<p>✅ No flagged ingredients found.</p>";
  return `<h4>Worth knowing</h4><ul>${found.map(f => `<li>${f}</li>`).join("")}</ul>`;
}
function manualForm() {
  return `<h3>Product not found</h3>
  <p>Enter what's on the label (per 100 g). Leave blank if unknown.</p>
  <input id="m_sugar" type="number" step="0.1" placeholder="Sugar (g)"><br>
  <input id="m_sat" type="number" step="0.1" placeholder="Saturated fat (g)"><br>
  <input id="m_salt" type="number" step="0.01" placeholder="Salt (g)"><br>
  <textarea id="m_ing" rows="4" style="width:100%" placeholder="Paste or type the ingredients"></textarea><br>
  <button onclick="manualCheck()">Analyze</button>
  <div id="m_out"></div>`;
}

function manualCheck() {
  const num = id => {
    const v = parseFloat(document.getElementById(id).value);
    return isNaN(v) ? undefined : v;
  };
  const n = { sugars_100g: num("m_sugar"), "saturated-fat_100g": num("m_sat"), salt_100g: num("m_salt") };
  const ing = document.getElementById("m_ing").value;
  document.getElementById("m_out").innerHTML = verdict(n, undefined, ing) + flagsHtml(ing);
}
    async function lookup(code) {
      const out = document.getElementById("result");
      if (!code) { out.textContent = "Enter or scan a barcode."; return; }
      out.textContent = "Loading...";
      try {
        const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json`);
        const data = await res.json();
        if (data.status !== 1) {
          out.innerHTML = manualForm();
          return;
        }
        const p = data.product;
        const n = p.nutriments || {};
        const ns = p.nutriscore_grade && p.nutriscore_grade !== "unknown"
          ? p.nutriscore_grade.toUpperCase() : "Not enough data";
        out.innerHTML = `
          <h3>${p.product_name || "Unknown"}</h3>
          ${verdict(n, p.nova_group, p.ingredients_text)}
          ${flagsHtml(p.ingredients_text)}
          <p><b>Nutri-Score:</b> ${ns}
             | <b>NOVA:</b> ${p.nova_group || "n/a"} (4 = ultra-processed)</p>
          <h4>Per 100 g</h4>
          ${row("Sugar", n.sugars_100g, 5, 22.5)}
          ${row("Saturated fat", n["saturated-fat_100g"], 1.5, 5)}
          ${row("Salt", n.salt_100g, 0.3, 1.5)}
          <p><b>Ingredients:</b> ${p.ingredients_text || "Not available"}</p>
        `;
      } catch (e) {
        out.textContent = "Something went wrong.";
      }
    }
  </script>
</body>
</html>
